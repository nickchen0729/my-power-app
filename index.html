<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我讀自升級</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #0b0b12;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 932px;
      background: #12121c;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
    }

    /* 舞台與角色區 */
    .stage-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .stage-bg {
      background: radial-gradient(circle at 50% 40%, #2a1b4e 0%, #12121c 70%);
      z-index: 1;
    }
    
    #stageCharacter {
      position: absolute;
      bottom: 25%;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 300px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center bottom;
      z-index: 2;
    }
    
    #stagePet {
      position: absolute;
      bottom: 22%;
      left: 18%;
      width: 110px;
      height: 110px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center bottom;
      z-index: 3;
      font-size: 65px;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5));
    }
    #stagePet img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 頂部 HUD */
    .top-hud {
      position: relative;
      z-index: 10;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), rgba(0,0,0,0));
    }
    .user-profile-card {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      cursor: pointer;
    }
    .avatar-box {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #3a2d5c;
      margin-right: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      border: 2px solid #ffd700;
      overflow: hidden;
    }
    .avatar-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .progress-bar-bg {
      width: 100px;
      height: 6px;
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
      margin-top: 3px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: #ffd700;
      width: 0%;
      transition: width 0.3s ease;
    }
    .setting-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    /* 底部 HUD */
    .bottom-hud {
      position: relative;
      z-index: 10;
      padding: 20px;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 20%, rgba(0,0,0,0));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .quick-wheels {
      display: flex;
      gap: 10px;
    }
    .btn-main {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff9800, #ff5722);
      color: white;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 87, 34, 0.4);
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
      transition: transform 0.05s ease;
    }
    .btn-main:active {
      transform: scale(0.97);
    }
    .btn-sec {
      background: rgba(255, 255, 255, 0.12);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    /* 彈窗蓋板 */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-card {
      background: #1e1e2d;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      padding: 22px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .close-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 22px;
      cursor: pointer;
    }

    /* 全螢幕獨立頁面 */
    .full-page-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #12121c;
      z-index: 90;
      display: none;
      flex-direction: column;
    }
    .page-header {
      padding: 15px 20px;
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.05);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    /* 寵物網格 (70種寵物圖鑑) */
    .pet-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      margin-top: 10px;
      padding: 5px;
    }
    .pet-grid-item {
      aspect-ratio: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      cursor: pointer;
    }
    .pet-grid-item.locked {
      filter: grayscale(1);
      opacity: 0.3;
      cursor: not-allowed;
    }
    .pet-grid-item.active {
      border-color: #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
      background: rgba(255, 215, 0, 0.1);
    }

    /* 轉盤樣式 */
    .wheel-container {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 30px auto;
    }
    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 6px solid #ffd700;
      box-sizing: border-box;
      transition: transform 4s cubic-bezier(0.15, 0.99, 0.18, 1);
      background: conic-gradient(
        #ff5252 0deg 90deg, 
        #e040fb 90deg 180deg, 
        #448aff 180deg 270deg, 
        #1de9b6 270deg 360deg
      );
    }
    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 26px solid #ffffff;
      z-index: 10;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,0.5));
    }

    /* 抽卡顯示區域 */
    .gacha-display-box {
      width: 140px;
      height: 140px;
      margin: 15px auto;
      border-radius: 16px;
      background: rgba(255,255,255,0.05);
      border: 2px dashed rgba(255,255,255,0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 60px;
      overflow: hidden;
    }
  </style>
</head>
<body>

<div class="game-container">

    </div>
  </div>

  <!-- 彈窗：換裝/角色切換 -->

    <div class="modal-card" style="text-align: center;">

      <div style="display: flex; gap: 15px; margin-top: 10px;">

        <button class="btn-sec" style="flex: 1; padding: 15px;" onclick="setGender('♀'); closeModal('avatarModal');">👧 女 (預設黑貓)</button>
      </div>
    </div>
  </div>

  <!-- 彈窗：寵物抽卡與圖鑑選單 -->
  <div class="modal-overlay" id="petSelectModal">
    <div class="modal-card" style="text-align: center;">

      <br>
      <button class="btn-sec" style="margin-top: 20px; font-size: 12px;" onclick="showWheelProbability()">查看 Buff 機率表</button>

    function getPetByCode(code) {
        for (let rarity in petDatabase) {
            let found = petDatabase[rarity].items.find(p => p.code === code);
            if(found) return found;
        }
        return petDatabase.R.items[1];
    }

    function updateHUD() {
        document.getElementById('hudPower').innerText = power.toLocaleString();
        document.getElementById('modalPower').innerText = power.toLocaleString();
        document.getElementById('wheelCurrentPower').innerText = power.toLocaleString();

        const level = Math.floor(power / 100);
        const currentProgress = power % 100;
        document.getElementById('hudLevel').innerText = level;
        document.getElementById('progressBar').style.width = `${currentProgress}%`;
        document.getElementById('rankPointText').innerText = `${level} 階 ${currentProgress} 點`;

        points = Math.floor(score / 5);
        document.getElementById('wheelScore').innerText = score;
        document.getElementById('wheelPoints').innerText = points;
        document.getElementById('gachaTickets').innerText = tickets;
        document.getElementById('ownedPetsCount').innerText = ownedPets.length;

        updateCharacterLayer();
        updatePetLayer();
        renderPetGrid();
    }

    function updateCharacterLayer() {
        const charLayer = document.getElementById('stageCharacter');
        const imgName = currentGender === '♂' ? 'char_male.png' : 'char_female.png';
        const img = new Image();
        img.src = imgName;
        img.onload = () => { charLayer.style.backgroundImage = `url('${imgName}')`; charLayer.innerText = ''; };
        img.onerror = () => { charLayer.style.backgroundImage = 'none'; charLayer.innerText = currentGender === '♂' ? '👦' : '👧'; charLayer.style.fontSize = '120px'; charLayer.style.display = 'flex'; charLayer.style.alignItems = 'center'; charLayer.style.justifyContent = 'center'; };
    }

    function updatePetLayer() {
        const petObj = getPetByCode(currentSelectedPetCode);
        const stagePet = document.getElementById('stagePet');
        const hudAvatar = document.getElementById('hudAvatar');

        const img = new Image();
        img.src = petObj.img;
        img.onload = () => {
            stagePet.innerHTML = `<img src="${petObj.img}" alt="${petObj.name}">`;
            hudAvatar.innerHTML = `<img src="${petObj.img}" alt="${petObj.name}">`;
        };
        img.onerror = () => {
            stagePet.innerHTML = petObj.icon;
            hudAvatar.innerHTML = petObj.icon;
        };
    }

    function renderPetGrid() {
        const grid = document.getElementById('petGrid');
        grid.innerHTML = "";

        ['SC', 'SAR', 'AR', 'SSR', 'SR', 'R', 'N'].forEach(rarity => {
            petDatabase[rarity].items.forEach(pet => {
                const isOwned = ownedPets.includes(pet.code);
                const isSelected = currentSelectedPetCode === pet.code;

                const item = document.createElement('div');
                item.className = `pet-grid-item ${isOwned ? '' : 'locked'} ${isSelected ? 'active' : ''}`;
                item.innerText = pet.icon;
                item.title = `[${pet.code}] ${pet.name} (${rarity})`;

                if(isOwned) {
                    item.onclick = () => selectPet(pet.code);
                }
                grid.appendChild(item);
            });
        });
    }

    function addDemoScore() {
        score += 15;
        updateHUD();
        alert("🎉 獲得 +15 分數！(可轉換為 3 點數)");
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function openFullPage(id) { closeModal('wheelSelectModal'); document.getElementById(id).style.display = 'flex'; }
    function closeFullPage(id) { document.getElementById(id).style.display = 'none'; }

    function updateName(val) { if(val.trim() !== "") document.getElementById('hudName').innerText = val; }
    
    function setGender(gender) {
        currentGender = gender;
        document.getElementById('hudGender').innerText = gender;
        if (gender === '♂') {
            currentSelectedPetCode = "R-03";
        } else {
            currentSelectedPetCode = "R-02";
        }
        updateHUD();
    }

    function selectPet(petCode) {
        currentSelectedPetCode = petCode;
        updateHUD();
        closeModal('petSelectModal');
    }

    function spinWheel() {
        if(isSpinning) return;
        if(points < 3) {
            alert("❌ 點數不足！抽 1 次卡牌轉盤需要 3 點數 (5分數 = 1點數)。");
            return;
        }

        score -= 15;
        updateHUD();

        isSpinning = true;
        const disc = document.getElementById('wheelDisc');

        const rand = Math.random() * 100;
        let quality = 'N';
        let targetAngle = 315;

        if (rand < 1) { quality = 'SSR'; targetAngle = 45; }
        else if (rand < 11) { quality = 'SR'; targetAngle = 135; }
        else if (rand < 61) { quality = 'R'; targetAngle = 225; }

        const extraRounds = 5 * 360;
        currentRotation += extraRounds + (360 - (targetAngle % 360)) + (Math.random() * 20 - 10);
        disc.style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            isSpinning = false;
            const pool = buffPool[quality];
            const reward = pool[Math.floor(Math.random() * pool.length)];

            const isBoosted = Math.random() < 0.1;
            const gainedPower = isBoosted ? reward.boosted : reward.base;
            
            power += gainedPower;
            updateHUD();

            let msg = `🎲 抽卡結果：[${quality}] ${reward.name}！\n`;
            if(isBoosted) msg += `🔥 觸發【極稀有增幅】！\n`;
            msg += `⚔️ 戰力 +${gainedPower}`;
            if(reward.desc) msg += ` (${reward.desc})`;

            alert(msg);
        }, 4000);
    }

    function showWheelProbability() {
        alert("🎲 戰力卡牌轉盤機率與 Buff 表：\n\n🏆 SSR (1%)：\n - 神聖戰力聖杯 (+1000 / 增幅 +3000)\n - 時光逆轉沙漏\n - 永恆王者王冠\n\n🟣 SR (10%)：\n - 超額爆發力、目標強化劑、連續執念護符\n\n🔵 R (50%)：\n - 經驗加速魔藥、專注藥水、早鳥羽毛等 10 種戰術 Buff\n\n⚪ N (39%)：\n - 基礎戰力結晶 (+100 / 增幅 +300) 等 9 種結晶");
    }

    function showGachaProbability() {
        let text = "🐾 70 種寵物完整抽卡機率表：\n\n";
        text += "👑 SC 階級 (0.331%) - 1張：創世星穹幻龍 🐉\n\n";
        text += "✨ SAR 階級 (0.889%) - 3張：裂空風暴巨鷹 🦅, 九尾天狐 🦊...\n\n";
        text += "🌟 AR 階級 (1.412%) - 5張：獨角獸 🦄, 聖獅 🦁...\n\n";
        text += "🔥 SSR 階級 (3.114%) - 7張：泰坦岩甲熊 🐻...\n\n";
        text += "💎 SR 階級 (5.667%) - 7張：猛虎戰士 🐅...\n\n";
        text += "⚔️ R 階級 (25.000%) - 15張：冰原雪狼 🐺...\n\n";
        text += "🐾 N 階級 (63.587%) - 32張：金毛 🐕, 小貓 🐈...\n\n";
        text += "⚠️ 提醒：寵物絕不增加戰力值！";
        alert(text);
    }

    function drawGacha(times) {
        if(tickets < times) {
            alert("❌ 扭蛋券不足！請參加活動獲取扭蛋券。");
            return;
        }

        tickets -= times;
        drawCount += times;

        const rand = Math.random() * 100;
        let rarity = "N";

        if (rand < 0.331) rarity = "SC";
        else if (rand < 0.331 + 0.889) rarity = "SAR";
        else if (rand < 0.331 + 0.889 + 1.412) rarity = "AR";
        else if (rand < 0.331 + 0.889 + 1.412 + 3.114) rarity = "SSR";
        else if (rand < 0.331 + 0.889 + 1.412 + 3.114 + 5.667) rarity = "SR";
        else if (rand < 0.331 + 0.889 + 1.412 + 3.114 + 5.667 + 25.000) rarity = "R";

        const pool = petDatabase[rarity].items;
        const drawnPet = pool[Math.floor(Math.random() * pool.length)];

        if(!ownedPets.includes(drawnPet.code)) {
            ownedPets.push(drawnPet.code);
        }
        currentSelectedPetCode = drawnPet.code;

        const box = document.getElementById('gachaDisplayBox');
        const img = new Image();
        img.src = drawnPet.img;
        img.onload = () => { box.innerHTML = `<img src="${drawnPet.img}" style="width:100%;height:100%;object-fit:contain;">`; };
        img.onerror = () => { box.innerHTML = `<div style="font-size:55px;">${drawnPet.icon}</div>`; };

        document.getElementById('gachaDisplayName').innerText = `[${drawnPet.code}] ${drawnPet.name} (${rarity})`;
        document.getElementById('gachaDrawCount').innerText = `已抽次數：${drawCount}`;

        updateHUD();
        alert(`✨ 恭喜獲得：[${rarity}] ${drawnPet.name} ${drawnPet.icon}！\n🎉 已解鎖並自動為您更換至舞台！`);
    }

    window.onload = updateHUD;
</script>
