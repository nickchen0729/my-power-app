<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戰力里程碑系統 - 手帳目標版</title>
    <!-- 綁定主畫面 App 圖示 -->
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-blue: #4facfe;
            --accent-cyan: #00f2fe;
            --accent-red: #ff0844;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 480px; }
        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            margin-bottom: 16px;
        }
        h1, h2, h3 { text-align: center; color: var(--accent-blue); margin: 5px 0 15px 0; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }
        .stat-box { background: #2a2a2a; padding: 10px; border-radius: 10px; }
        .stat-value { font-size: 22px; font-weight: bold; color: var(--accent-cyan); }
        .buff-box { background: #332a00; border: 1px solid #ffcc00; color: #ffea79; padding: 8px 12px; border-radius: 8px; margin-top: 10px; font-size: 13px; }
        
        /* 任務清單樣式 */
        .section-title { font-weight: bold; color: var(--accent-cyan); border-bottom: 2px solid #333; padding-bottom: 6px; margin-top: 15px; display: flex; justify-content: space-between; align-items: center;}
        .task-item {
            display: flex;
            align-items: center;
            background: #262626;
            padding: 10px 12px;
            border-radius: 8px;
            margin-top: 8px;
            gap: 10px;
        }
        .task-item.completed { opacity: 0.5; text-decoration: line-through; }
        .task-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent-cyan); cursor: pointer; }
        .task-info { flex: 1; }
        .task-title { font-size: 15px; font-weight: 500; }
        .task-hours { font-size: 12px; color: var(--text-sub); }
        .tag-over { background: #ff0844; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        
        /* 輸入與按鈕 */
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        input[type="text"], input[type="number"], select {
            background: #2a2a2a; border: 1px solid #444; color: white; padding: 10px; border-radius: 8px; font-size: 14px;
        }
        button {
            padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: bold;
            background: linear-gradient(135deg, var(--accent-blue) 0%, var(--accent-cyan) 100%);
            color: #000; cursor: pointer;
        }
        button:active { transform: scale(0.98); }
        button.wheel-btn { background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%); color: #fff; width: 100%; margin-top: 10px;}
        .btn-del { background: #444; color: #ff6b6b; padding: 4px 8px; font-size: 12px; border-radius: 4px;}
        .log-box { background: #000; padding: 10px; border-radius: 8px; height: 100px; overflow-y: auto; font-size: 12px; color: #aaa; }
        .hours-summary { text-align: right; font-size: 14px; color: #ffcc00; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 狀態卡片 -->
    <div class="card">
        <h1>⚔️ 戰力手帳系統</h1>
        <div class="stat-grid">
            <div class="stat-box">
                <div>總戰力 (Power)</div>
                <div class="stat-value" id="power">0</div>
            </div>
            <div class="stat-box">
                <div>技能點 (SP)</div>
                <div class="stat-value" id="sp">0</div>
            </div>
        </div>
        <div style="text-align: center; margin-top: 10px; color: var(--text-sub); font-size: 13px;">
            零頭積分：<span id="score">0</span> / 5 分 (每滿 5 分換 1 SP)
        </div>
        <div id="buffContainer"></div>
        <button class="wheel-btn" onclick="drawWheel()">🎲 啟動輪盤 (消耗 3 SP)</button>
    </div>

    <!-- 新增任務卡片 -->
    <div class="card">
        <h3>📝 新增手帳目標 (+3分/項)</h3>
        <div class="input-group">
            <input type="text" id="taskName" placeholder="目標內容 (例：地理 2 課)">
            <div style="display: flex; gap: 8px;">
                <input type="number" id="taskHours" placeholder="預估時長 (小時)" style="flex: 1;">
                <select id="taskType" style="flex: 1;">
                    <option value="normal">一般目標</option>
                    <option value="over">超額目標 🔥</option>
                </select>
            </div>
            <button onclick="addTask()">➕ 新增至目標清單</button>
        </div>
    </div>

    <!-- 手帳目標清單 -->
    <div class="card">
        <h2>📋 目標清單</h2>
        <div class="hours-summary" id="hoursSummary">預估總時長：0 小時</div>
        
        <div class="section-title">一般目標</div>
        <div id="normalTaskList"></div>

        <div class="section-title" style="color: #ff758c; margin-top: 20px;">超額目標 🔥</div>
        <div id="overTaskList"></div>
    </div>

    <!-- 歷程紀錄 -->
    <div class="card">
        <h3>📜 系統日誌</h3>
        <div class="log-box" id="logs"></div>
    </div>
</div>

<script>
    // 玩家與任務狀態
    let p = {
        score: 0,
        sp: 0,
        power: 0,
        nextGoalMult: 1,
        nextExamBuff: false,
        nextSetGoalBonus: 0,
        nextOverBonus: 0,
        tasks: []
    };

    function loadData() {
        const saved = localStorage.getItem("gameData_v2");
        if (saved) p = JSON.parse(saved);
        updateUI();
    }

    function saveData() {
        localStorage.setItem("gameData_v2", JSON.stringify(p));
        updateUI();
    }

    function log(msg) {
        const logBox = document.getElementById("logs");
        logBox.innerHTML = `> ${msg}<br>` + logBox.innerHTML;
    }

    // 更新畫面顯示
    function updateUI() {
        document.getElementById("power").innerText = p.power;
        document.getElementById("sp").innerText = p.sp;
        document.getElementById("score").innerText = p.score;

        // 顯示 Buff
        let buffHtml = "";
        if (p.nextGoalMult > 1) buffHtml += `<div class="buff-box">⚡ 狂暴 Buff：下一次完成目標得分 ${p.nextGoalMult} 倍！</div>`;
        if (p.nextExamBuff) buffHtml += `<div class="buff-box">⚡ 極光 Buff：下次段考 90 分以上科目總分獲得加成！</div>`;
        if (p.nextSetGoalBonus > 0) buffHtml += `<div class="buff-box">⚡ 神聖 Buff：下次設定目標基礎得分 +${p.nextSetGoalBonus} 分！</div>`;
        if (p.nextOverBonus > 0) buffHtml += `<div class="buff-box">⚡ 超載 Buff：下次超額完成額外 +${p.nextOverBonus} 分！</div>`;
        document.getElementById("buffContainer").innerHTML = buffHtml;

        // 渲染任務列表
        const normalBox = document.getElementById("normalTaskList");
        const overBox = document.getElementById("overTaskList");
        normalBox.innerHTML = "";
        overBox.innerHTML = "";

        let totalHours = 0;

        p.tasks.forEach((task, index) => {
            totalHours += Number(task.hours || 0);
            const itemHtml = `
                <div class="task-item ${task.completed ? 'completed' : ''}">
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
                    <div class="task-info">
                        <div class="task-title">
                            ${task.type === 'over' ? '<span class="tag-over">超額</span> ' : ''}${task.title}
                        </div>
                        <div class="task-hours">${task.hours ? '約 ' + task.hours + ' hr' : '未標註時長'}</div>
                    </div>
                    <button class="btn-del" onclick="deleteTask(${index})">刪除</button>
                </div>
            `;

            if (task.type === 'over') {
                overBox.innerHTML += itemHtml;
            } else {
                normalBox.innerHTML += itemHtml;
            }
        });

        document.getElementById("hoursSummary").innerText = `預估總時長：約 ${totalHours} hr`;
    }

    // 加分邏輯
    function addScore(basePoints, type) {
        let gain = basePoints;

        if (type === 'setGoal' && p.nextSetGoalBonus > 0) {
            gain += p.nextSetGoalBonus;
            p.nextSetGoalBonus = 0;
        } else if (type === 'completeGoal' && p.nextGoalMult > 1) {
            gain *= p.nextGoalMult;
            p.nextGoalMult = 1;
        } else if (type === 'overachieve' && p.nextOverBonus > 0) {
            gain += p.nextOverBonus;
            p.nextOverBonus = 0;
        }

        p.score += gain;
        log(`獲得積分：${gain >= 0 ? '+' : ''}${gain} 分`);

        while (p.score >= 5) {
            p.score -= 5;
            p.sp += 1;
            log(`✨ 積分滿 5 分！獲得 1 點技能點數 (SP +1)`);
        }

        if (p.score < 0 && p.sp > 0) {
            p.sp -= 1;
            p.score += 5;
        }
    }

    // 新增任務 (設定1個目標 +3分)
    function addTask() {
        const title = document.getElementById("taskName").value.trim();
        const hours = document.getElementById("taskHours").value;
        const type = document.getElementById("taskType").value;

        if (!title) {
            alert("請輸入目標名稱！");
            return;
        }

        p.tasks.push({ title, hours, type, completed: false });
        log(`📝 設定新目標：《${title}》`);
        
        // 自動執行設定目標得分 (+3 分，並檢測 Buff)
        addScore(3, 'setGoal');

        // 清空輸入框
        document.getElementById("taskName").value = "";
        document.getElementById("taskHours").value = "";
        saveData();
    }

    // 勾選/取消任務
    function toggleTask(index) {
        const task = p.tasks[index];
        task.completed = !task.completed;

        if (task.completed) {
            log(`✅ 完成目標：《${task.title}》`);
            if (task.type === 'over') {
                addScore(10, 'overachieve'); // 超額目標完成 +10 分
            } else {
                addScore(1, 'completeGoal');  // 一般目標完成 +1 分
            }
        } else {
            log(`↩️ 取消勾選：《${task.title}》`);
            // 取消勾選時扣回基礎分
            addScore(task.type === 'over' ? -10 : -1, 'none');
        }

        saveData();
    }

    // 刪除任務
    function deleteTask(index) {
        if (confirm("確定要刪除這個目標嗎？")) {
            p.tasks.splice(index, 1);
            saveData();
        }
    }

    // 輪盤抽獎機制 (1% SSR + 1% Buff)
    function drawWheel() {
        if (p.sp < 3) {
            alert("❌ 技能點數不足！需要 3 點 SP 才能抽獎。");
            return;
        }

        p.sp -= 3;
        const rewardRoll = Math.floor(Math.random() * 100) + 1;
        const buffRoll = Math.floor(Math.random() * 100) + 1;
        const isBuffed = (buffRoll === 1);

        if (isBuffed) log(`⚡⚡⚡ 🌟 觸發 1% 極稀有增幅 (BUFF ACTIVE)！ 🌟 ⚡⚡⚡`);

        if (rewardRoll === 1) { // 1% SSR
            if (isBuffed) {
                p.power += 3000;
                log(`🏆 【SSR 神蹟】神聖戰力聖杯 (增幅版)！ 戰力 +3000！解鎖《不朽神話》！`);
            } else {
                p.power += 1000;
                log(`🏆 【SSR 傳奇】神聖戰力聖杯！ 戰力 +1000！解鎖《傳奇冒險者》！`);
            }
        } else if (rewardRoll <= 5) { // 4% SR
            p.nextOverBonus = isBuffed ? 40 : 20;
            log(`🟣 【SR ${isBuffed ? '超載' : '史詩'}】超額爆發力！下次超額完成得分 +${p.nextOverBonus}`);
        } else if (rewardRoll <= 11) { // 6% SR
            p.nextSetGoalBonus = isBuffed ? 9 : 3;
            log(`🟣 【SR ${isBuffed ? '神聖' : '史詩'}】目標強化劑！下次設定目標加分 +${p.nextSetGoalBonus}`);
        } else if (rewardRoll <= 31) { // 20% R
            p.nextExamBuff = true;
            log(`🔵 【R ${isBuffed ? '極光' : '稀有'}】高分強效光環！段考加成已啟動！`);
        } else if (rewardRoll <= 61) { // 30% R
            p.nextGoalMult = isBuffed ? 3 : 2;
            log(`🔵 【R ${isBuffed ? '狂暴' : '稀有'}】經驗加速魔藥！下次完成目標得分 ${p.nextGoalMult} 倍！`);
        } else { // 38% N
            const gainPower = isBuffed ? 300 : 100;
            p.power += gainPower;
            log(`⚪ 【N ${isBuffed ? '暴擊' : '普通'}】基礎戰力結晶！ 戰力 +${gainPower}`);
        }

        saveData();
    }

    loadData();
</script>
</body>
</html>
